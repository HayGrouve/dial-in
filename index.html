<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edf0ea" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme before first paint to avoid a light/dark flash. Mirrors src/lib/theme.ts.
      ;(function () {
        var pref = localStorage.getItem('kafeto-theme')
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0e1a15' : '#edf0ea')
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Кафето" />
    <meta name="description" content="Помни на колко да мелиш всяко кафе, което някога си купувал." />
    <meta property="og:title" content="Онова за кафето" />
    <meta property="og:description" content="Помни на колко да мелиш всяко кафе, което някога си купувал." />
    <title>Онова за кафето</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
